# edit this in [[ source.html_url ]]

name: Check news

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  check-news:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check News
        uses: conda/actions/check-news@ade1a3a5e5b7d3d124a03bf5d8c841645fb92a37 # v26.9.4
        with:
          skip-label: no-news
          require-pr-number: true
          news-directory: '[[news_directory | default("news")]]'
