# template-files-set [%- set on_demand = on_demand | default(false) %]

name: Prepare release notes

on:
  # template-files-if [%- if not on_demand %]
  workflow_run:
    workflows:
      - '[[ tests_workflow | default("Tests") ]]'
    types:
      - completed
    branches:
      - '[0-9].*.x'
      - '[0-9][0-9].*.x'
  # template-files-else [%- else %]
  workflow_dispatch:
    inputs:
      version:
        description: Release version to prepare (MAJOR.MINOR.PATCH).
        required: true
        type: string
  # template-files-endif [%- endif %]

concurrency:
  group: ${{ github.workflow }}-[[ "${{ github.ref_name }}" if on_demand else "${{ github.event.workflow_run.head_branch }}" ]]
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    # template-files-if [%- if not on_demand %]
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    # template-files-endif [%- endif %]
    runs-on: ubuntu-slim
    steps:
      - name: Prepare Release Notes
        uses: conda/actions/prepare-release@8153f7f73472ac36d654d5111be19abaecc48cc6 #v26.10.0
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          news-directory: '[[news_directory | default("news")]]'
          changelog-path: CHANGELOG.md
          # template-files-if [%- if on_demand %]
          version: ${{ inputs.version }}
          # template-files-endif [%- endif %]
          release-branch-pattern: |
            [0-9].*.x
            [0-9][0-9].*.x
