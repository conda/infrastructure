# edit this in [[ source.html_url ]]

name: Check authors

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - name: Check Authors
        uses: conda/actions/prepare-authors@c88b9c76ebfbebd6c39ea713f8fa3b0e08fd7e80 # v26.9.2
        with:
          mode: check
          since: tag
