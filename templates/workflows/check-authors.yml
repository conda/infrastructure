# edit this in [[ source.html_url ]]

name: Check authors

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-slim
    steps:
      - name: Check Authors
        uses: conda/actions/prepare-authors@210fa69f0b174ee4ea463a3a5402ec5a1d95d6db # v26.9.0
        with:
          mode: check
          since: tag
