name: Prepare authors

on:
  # https://crontab.guru/#[[ schedule | default("0 3 * * 1") | replace(" ", "_") ]]
  schedule:
    - cron: '[[ schedule | default("0 3 * * 1") ]]'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    if: '!github.event.repository.fork'
    runs-on: ubuntu-slim
    steps:
      - name: Prepare Authors
        uses: conda/actions/prepare-authors@8153f7f73472ac36d654d5111be19abaecc48cc6 # v26.10.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          since: tag
          base-branch: main
