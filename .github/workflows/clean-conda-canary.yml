name: Clean conda-canary

on:
  workflow_dispatch:
    inputs:
      dryrun:
        description: 'dryrun: Preview packages to remove without removing them (true|false)'
        required: true
        type: boolean
        default: true

  # every Sunday at 02:36 UTC
  # https://crontab.guru/#36_2_*_*_0
  schedule:
    - cron: 36 2 * * 0

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clean:
    name: Remove packages uploaded over a month ago
    if: '!github.event.repository.fork'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install anaconda-client
        run: pip install anaconda-client==1.15.0

      - name: Remove stale conda-canary packages
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_ORG_CONDA_CANARY_TOKEN }}
          DRYRUN: ${{ inputs.dryrun || false }}
        run: |
          [ "${DRYRUN}" = "true" ] && args=(--dry-run) || args=()
          python clean_conda_canary.py "${args[@]}"
